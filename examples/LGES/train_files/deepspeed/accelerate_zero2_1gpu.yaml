# accelerate launch config for one GPU. Same as starVLA/config/deepseeds/deepspeed_zero2.yaml, except that it
# points at our DeepSpeed config (smaller ZeRO buffers) and names one process.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_config_file: "./examples/LGES/train_files/deepspeed/ds_config_1gpu.json"
  deepspeed_multinode_launcher: standard
  zero3_init_flag: false
distributed_type: DEEPSPEED
num_machines: 1
num_processes: 1
